<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User registration form">
    <meta name="author" content="Muhammad Ali">
    <meta name="keywords" content="HTML, form, registration, web development">
    <title>Registration Form</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 40px 20px;
    }

    form {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: inline-block;
        margin-bottom: 6px;
        font-weight: 500;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #333;
    }

    input[type="radio"],
    input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 8px;
    }

    button[type="submit"] {
        background: #222;
        color: white;
    }

    button[type="reset"] {
        background: #ddd;
    }

    button:hover {
        opacity: 0.85;
    }

    .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .options {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .form-section {
        margin-top: 10px;
    }



    @media (max-width: 600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="/submit" method="post">

    <div class="form-grid">

        <!-- First Name -->
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter your first name"
                required
            >
        </div>

        <!-- Last Name -->
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter your last name"
                required
            >
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <!-- Contact -->
        <div class="form-group">
            <label for="contact">Contact Number:</label>
            <input
                type="tel"
                id="contact"
                name="contact"
                placeholder="+92 300 1234567"
                required
            >
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
            >
        </div>

        <!-- Country -->
        <div class="form-group">
            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select your country</option>
                <option value="pakistan">Pakistan</option>
                <option value="india">India</option>
                <option value="usa">United States</option>
                <option value="uk">United Kingdom</option>
                <option value="canada">Canada</option>
                <option value="australia">Australia</option>
                <option value="germany">Germany</option>
                <option value="uae">United Arab Emirates</option>
            </select>
        </div>

        <!-- City -->
        <div class="form-group">
            <label for="city">City:</label>
            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
            >
        </div>

        <!-- Gender -->
        <div class="form-section full-width">
            <label>Gender:</label>

            <div class="options">
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </div>
        </div>

        <!-- Address -->
        <div class="form-group full-width">
            <label for="address">Address:</label>
            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter your address"
            ></textarea>
        </div>

        <!-- Website -->
        <div class="form-group">
            <label for="website">Website:</label>
            <input
                type="url"
                id="website"
                name="website"
                placeholder="https://google.com"
            >
        </div>

        <!-- Profile Picture -->
        <div class="form-group">
            <label for="profile">Profile Picture:</label>
            <input
                type="file"
                id="profile"
                name="profile"
                accept="image/*"
            >
        </div>

        <!-- Skills -->
        <div class="form-section full-width">
            <label>Skills:</label>

            <div class="options">
                <label>
                    <input type="checkbox" name="skills" value="html">
                    HTML
                </label>

                <label>
                    <input type="checkbox" name="skills" value="css">
                    CSS
                </label>

                <label>
                    <input type="checkbox" name="skills" value="javascript">
                    JavaScript
                </label>

                <label>
                    <input type="checkbox" name="skills" value="react">
                    React
                </label>
            </div>
        </div>

        <!-- Terms -->
        <div class="form-section full-width">
            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            >

            <label for="terms">
                I agree to the Terms and Conditions
            </label>
        </div>

        <!-- Buttons -->
        <div class="buttons full-width">
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>

    </div>

</form>

</body>
</html>
